---
version: "3.8"

services:

  devopsdb:
    image: ashraysambu/devops:db

    ports:
      - "2222:3306"

    networks:
      - db-net

    volumes:
      - db-data:/var/lib/mysql

    deploy:
      replicas: 1

      resources:
        limits:
          cpus: "0.50"
          memory: 512M

        reservations:
          cpus: "0.25"
          memory: 256M

      restart_policy:
        condition: on-failure

  application:
    image: ashraysambu/devops:app

    ports:
      - "1234:8080"

    networks:
      - app-net
      - db-net

    depends_on:
      - devopsdb

    volumes:
      - app-data:/usr/local/tomcat/logs

    deploy:
      replicas: 2

      resources:
        limits:
          cpus: "1.0"
          memory: 1G

        reservations:
          cpus: "0.50"
          memory: 512M

      restart_policy:
        condition: on-failure

networks:

  db-net:
    driver: overlay

  app-net:
    driver: overlay

volumes:

  db-data:

  app-data:
