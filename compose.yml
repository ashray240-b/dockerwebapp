---
version: "3.9"

services:

  devopsdb:
    image: ashraysambu/sam:db

    ports:
      - "1111:3306"

    networks:
      - my-net

    volumes:
      - db-data:/var/lib/mysql

    deploy:
      replicas: 1

  application:
    image: ashraysambu/sam:app

    ports:
      - "1234:8080"

    networks:
      - my-net
      

    depends_on:
      - devopsdb

    volumes:
      - app-data:/usr/local/tomcat/logs

    deploy:
      replicas: 3

networks:

  my-net:
    driver: overlay

  

volumes:

  db-data:

  app-data:
